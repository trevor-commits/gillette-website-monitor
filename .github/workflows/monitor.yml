name: Website browser monitor
on:
  schedule:
    - cron: '11 */6 * * *'
  workflow_dispatch:
    inputs:
      runBrowser:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: website-monitor
  cancel-in-progress: false
jobs:
  browser:
    if: github.ref == 'refs/heads/main' && (github.event.schedule == '11 */6 * * *' || (github.event_name == 'workflow_dispatch' && inputs.runBrowser))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GILLETTE_PROBE_OWNER: github:trevor-commits/gillette-website-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Private heartbeat capability
        run: |
          export GILLETTE_BROWSER_HEARTBEAT_FILE="$RUNNER_TEMP/browser-ping"
          node -e "require('fs').writeFileSync(process.env.GILLETTE_BROWSER_HEARTBEAT_FILE,process.env.PING_URL,{mode:0o600,flag:'wx'})"
          echo "GILLETTE_BROWSER_HEARTBEAT_FILE=$GILLETTE_BROWSER_HEARTBEAT_FILE" >> "$GITHUB_ENV"
        env:
          PING_URL: ${{ secrets.HEALTHCHECKS_BROWSER_PING_URL }}
      - run: node browser.mjs
